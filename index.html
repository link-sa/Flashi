<title>فلاشي | Flashi</title>
<meta name="description" content="فلاشي – مرايا تصوير تفاعلية وطباعة فورية للمناسبات والفعاليات">

<style>
:root{
  --bg:#FBF9FE; --surface:#FFFFFF; --mist:#F1EBFA; --line:#E2D8F3;
  --plum:#5B3E96; --violet:#7E5BB8; --lilac:#A98BDB; --text:#3B2A5E; --muted:#7C6E98;
  --glow:rgba(169,139,219,.55);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16101F; --surface:#211832; --mist:#2A1F40; --line:#3A2D55;
    --plum:#CDB8F2; --violet:#B597EA; --lilac:#9C7FD6; --text:#EEE6FB; --muted:#A99BC4;
    --glow:rgba(181,151,234,.45); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16101F; --surface:#211832; --mist:#2A1F40; --line:#3A2D55;
  --plum:#CDB8F2; --violet:#B597EA; --lilac:#9C7FD6; --text:#EEE6FB; --muted:#A99BC4;
  --glow:rgba(181,151,234,.45); color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; min-height:100%; background:var(--bg); color:var(--text);
  font-family:"Alexandria","IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  -webkit-font-smoothing:antialiased;
}
main{max-width:440px;margin:0 auto;padding:28px 22px 40px;display:flex;flex-direction:column;align-items:center}

/* the mirror: the one bold element */
.mirror{
  position:relative; width:min(62vw,230px); aspect-ratio:3/4.4;
  border-radius:120px 120px 26px 26px; padding:7px;
  background:linear-gradient(160deg,#fff 0%,var(--lilac) 45%,var(--violet) 100%);
  box-shadow:0 0 0 1px var(--line),0 0 38px 4px var(--glow),0 18px 40px -18px rgba(60,30,110,.5);
  animation:light 1.8s ease-out 1 both;
}
.mirror img{width:100%;height:100%;object-fit:cover;object-position:28% 50%;display:block;border-radius:114px 114px 20px 20px}
.mirror::after{ /* flash sparkle */
  content:""; position:absolute; top:14%; left:-14px; width:34px; height:34px;
  background:var(--violet);
  clip-path:polygon(50% 0,58% 42%,100% 50%,58% 58%,50% 100%,42% 58%,0 50%,42% 42%);
}
@keyframes light{0%{box-shadow:0 0 0 1px var(--line),0 0 0 0 var(--glow),0 18px 40px -18px rgba(60,30,110,.5);filter:brightness(.92)}
 35%{filter:brightness(1.25)}100%{filter:none}}
@media (prefers-reduced-motion:reduce){.mirror{animation:none}}

.logo{width:230px;max-width:75%;height:auto;margin:48px 0 10px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo{filter:brightness(1.35)}}
.tag{margin:0;font-size:1.02rem;font-weight:400;color:var(--violet);text-align:center;line-height:1.7}
.sub{margin:6px 0 30px;font-size:.86rem;font-weight:300;color:var(--muted);text-align:center;line-height:1.8}

nav{width:100%;display:flex;flex-direction:column;gap:12px}
a.link{
  display:flex;align-items:center;gap:14px;padding:15px 18px;
  border-radius:16px;text-decoration:none;color:var(--text);
  background:var(--surface);border:1px solid var(--line);
  font-size:1rem;font-weight:500;transition:transform .15s,border-color .15s;
}
a.link small{display:block;font-size:.78rem;font-weight:300;color:var(--muted);margin-top:2px;direction:ltr;text-align:right}
a.link:hover{border-color:var(--lilac)}
a.link:active{transform:scale(.98)}
a.link:focus-visible{outline:3px solid var(--lilac);outline-offset:3px}
a.link .ic{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--mist);color:var(--violet)}
a.link .ic svg{width:22px;height:22px}
a.primary{background:var(--plum);border-color:var(--plum);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) a.primary{color:#1E1530}}
:root[data-theme="dark"] a.primary{color:#1E1530}
a.primary small{color:inherit;opacity:.8}
a.primary .ic{background:rgba(255,255,255,.18);color:inherit}

footer{margin-top:34px;font-size:.75rem;color:var(--muted);font-weight:300}
</style>
